<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, interactive-widget=resizes-content">
<link rel="stylesheet" href="xterm.css">
<style>
  html, body { margin: 0; height: 100%; background: #0d1117; overflow: hidden; -webkit-tap-highlight-color: transparent; }
  #wrap { display: flex; flex-direction: column; height: 100%; }
  #term { flex: 1; min-height: 0; padding: 2px 0 0 4px; box-sizing: border-box; touch-action: none; }
  .keys { display: flex; gap: 4px; padding: 4px 4px 0 4px; background: #161b22; }
  .keys:last-of-type { padding-bottom: 4px; }
  .k { flex: 1; min-width: 0; color: #c9d1d9; background: #21262d; border: 1px solid #30363d; border-radius: 7px;
       font: 600 14px/1 ui-monospace, monospace; padding: 11px 0; text-align: center; user-select: none; -webkit-user-select: none; }
  .k.wide { flex: 1.4; }
  .k.big { font-size: 19px; padding: 8px 0; }
  .k:active, .k.pressed { background: #30363d; }
  .k.on { background: #1f6feb; border-color: #388bfd; color: #fff; }
  #compose { display: flex; gap: 4px; padding: 4px; background: #161b22; border-top: 1px solid #21262d; align-items: flex-end; }
  #msg { flex: 1; min-height: 38px; max-height: 140px; resize: none; box-sizing: border-box; background: #0d1117; color: #e6edf3;
         border: 1px solid #30363d; border-radius: 8px; font: 15px/1.3 sans-serif; padding: 8px; outline: none; }
  #msg:focus { border-color: #388bfd; }
  #send { flex: 0 0 64px; background: #238636; border-color: #2ea043; color: #fff; padding: 12px 0; }
  #compose.hidden { display: none; }
</style>
</head>
<body>
<div id="wrap">
  <div id="term"></div>
  <div class="keys" id="row1"></div>
  <div class="keys" id="row2"></div>
  <div id="compose">
    <textarea id="msg" rows="1" placeholder="Prompt for Claude… (Send = paste + Enter)"></textarea>
    <div class="k" id="send">Send</div>
  </div>
</div>
<script src="xterm.js"></script>
<script src="addon-fit.js"></script>
<script src="terminal.js"></script>
</body>
</html>
